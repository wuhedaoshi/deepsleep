name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消上一轮，省 runner 也省时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（类型 / lint / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 需要 Node 22+，本地也是这么跑的
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: frontend
        run: pnpm type

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: 构建
        working-directory: frontend
        run: pnpm build

      - name: 上传构建产物（给 android 作业用）
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 1

  android:
    name: Android（编译 debug 包）
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      # assets/web 是构建期产物（不进仓库），这里按 build-apk 的做法同步一次
      - name: 同步前端产物
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r frontend/dist android/app/src/main/assets/web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 没有签名材料时 release 会打未签名包，debug 用 AGP 自带的调试证书即可
      - name: 编译
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
