name: 功能建议
description: 想让它多做点什么
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解决的问题
      description: 别急着给方案，先说场景——你在什么情况下觉得不顺手
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪块
      options:
        - 导入 / 导出
        - 上下文压缩
        - 聊天界面
        - Android 壳 / 原生能力
        - 构建与工程
        - 其他
    validations:
      required: true
