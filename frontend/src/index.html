<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Deepsleep</title>
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      旧 WebView 兼容垫片（必须在本文件的兜底脚本与 bundle 之前执行）。

      现场：Honor / MagicOS 8 的 WebView 缺少 Array.prototype.at，
      导入历史后渲染会话列表时抛 TypeError: r.at is not a function，
      React 整棵树卸载 → 界面全白。同一台机器还缺 Object.hasOwn 与 toReversed。
      这里补齐这些方法，而不是逐个改调用点（上游代码里有一批）。
    -->
    <script>
      (function () {
        // 记录「补了什么」和「补之前有没有」，导出日志时会带在环境信息里
        var patched = []
        window.__deepsleepShims = function () {
          return patched
        }

        function define(target, name, value, label) {
          if (typeof target[name] === 'function') {
            return
          }
          var host =
            target === Array.prototype ? 'Array' : target === String.prototype ? 'String' : ''
          patched.push(host ? host + '.' + name : label || name)
          Object.defineProperty(target, name, {
            value: value,
            writable: true,
            configurable: true,
          })
        }

        // Chrome 92+
        define(Array.prototype, 'at', function arrayAt(index) {
          var length = this.length >>> 0
          var offset = Math.trunc(Number(index)) || 0
          if (offset < 0) offset += length
          return offset < 0 || offset >= length ? undefined : this[offset]
        })
        define(String.prototype, 'at', function stringAt(index) {
          var length = this.length >>> 0
          var offset = Math.trunc(Number(index)) || 0
          if (offset < 0) offset += length
          return offset < 0 || offset >= length ? undefined : this.charAt(offset)
        })

        // Chrome 93+
        if (typeof Object.hasOwn !== 'function') {
          patched.push('Object.hasOwn')
          Object.hasOwn = function hasOwn(object, key) {
            return Object.prototype.hasOwnProperty.call(object, key)
          }
        }

        // Chrome 97+
        define(Array.prototype, 'findLast', function findLast(predicate, thisArg) {
          for (var i = this.length - 1; i >= 0; i -= 1) {
            if (predicate.call(thisArg, this[i], i, this)) return this[i]
          }
          return undefined
        })
        define(Array.prototype, 'findLastIndex', function findLastIndex(predicate, thisArg) {
          for (var i = this.length - 1; i >= 0; i -= 1) {
            if (predicate.call(thisArg, this[i], i, this)) return i
          }
          return -1
        })

        // Chrome 100+：发送路径会用 signal.throwIfAborted()；老 WebView 没有它就抛 TypeError
        if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.prototype.throwIfAborted !== 'function') {
          patched.push('AbortSignal.throwIfAborted')
          Object.defineProperty(AbortSignal.prototype, 'throwIfAborted', {
            value: function throwIfAborted() {
              if (this.aborted) {
                throw this.reason
              }
            },
            writable: true,
            configurable: true,
          })
        }

        // Chrome 110+（响应式数组方法）
        define(Array.prototype, 'toReversed', function toReversed() {
          return Array.prototype.slice.call(this).reverse()
        })
        define(Array.prototype, 'toSorted', function toSorted(compare) {
          return Array.prototype.slice.call(this).sort(compare)
        })
        define(Array.prototype, 'toSpliced', function toSpliced(start, deleteCount) {
          var copy = Array.prototype.slice.call(this)
          var rest = Array.prototype.slice.call(arguments, 2)
          copy.splice.apply(copy, [start, deleteCount].concat(rest))
          return copy
        })
        define(Array.prototype, 'with', function arrayWith(index, value) {
          var copy = Array.prototype.slice.call(this)
          var offset = Math.trunc(Number(index)) || 0
          if (offset < 0) offset += copy.length
          if (offset < 0 || offset >= copy.length) {
            throw new RangeError('Invalid index')
          }
          copy[offset] = value
          return copy
        })
      })()
    </script>    <!--
      内联兜底：不依赖打包产物，所以 bundle 语法错、模块加载失败、脚本被拦时它照样能跑。
      8 秒还没挂载就在页面上直接说话，并把一行日志写进原生文件——把「白屏」变成可读的输出。
    -->
    <script>
      (function () {
        function report(reason) {
          var root = document.getElementById('root')
          if (!root || root.childElementCount > 0) {
            return
          }
          root.innerHTML =
            '<div style="padding:28px 18px;font:14px/1.7 -apple-system,system-ui,sans-serif;color:#111">' +
            '<h1 style="font-size:18px;margin:0 0 10px">界面没加载出来</h1>' +
            '<p style="margin:0 0 10px;color:#555">脚本没有正常启动（' +
            reason +
            '）。这不是白屏卡死，而是前端 bundle 没跑起来。</p>' +
            '<p style="margin:0 0 10px;color:#555">日志文件：<code>Android/data/com.deepsleep.app/files/logs/deepsleep.log</code></p>' +
            '<button id="reload" style="padding:9px 16px;border-radius:999px;border:1px solid #ccc;background:#f5f5f5;font-size:14px">重新加载</button>' +
            '</div>'
          var button = document.getElementById('reload')
          if (button) {
            button.onclick = function () {
              location.reload()
            }
          }
          try {
            var bridge = window.__deepsleepNative
            if (bridge && bridge.appendLog) {
              bridge.appendLog(
                new Date().toISOString() + ' ERROR [boot] 前端未挂载：' + reason
              )
            }
          } catch (error) {
            /* 桥不可用就算了，页面上已经给了说明 */
          }
        }

        window.__deepsleepBootOk = function () {
          window.__deepsleepBooted = true
        }
        window.setTimeout(function () {
          if (!window.__deepsleepBooted) {
            report('8 秒内没有挂载')
          }
        }, 8000)
        window.addEventListener('error', function (event) {
          if (!window.__deepsleepBooted && event && event.message) {
            report(event.message.slice(0, 120))
          }
        })
      })()
    </script>
  </body>
</html>
